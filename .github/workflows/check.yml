# Prüft jeden Push und jeden Pull Request: Syntax, Tests, Installer bauen und wirklich installieren.
# Läuft mit der ältesten unterstützten PHP-Version (8.0) und einer aktuellen.
# Lokal geht genau dasselbe mit: php tools/build-release.php   (siehe BUILD.md)
name: Prüfen

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, curl, sodium, zip, gd, mbstring, openssl
          coverage: none
      - name: Bauen und testen
        run: php tools/build-release.php
